<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hugo Brandão · Projetos</title>
<style>
:root{--bg:#F3F4F8;--ink:#141A2E;--muted:#5E6680;--line:#DCE0EA;--accent:#2C52D1;--surface:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0E1220;--ink:#E9ECF5;--muted:#99A1BB;--line:#2A3148;--accent:#7D9BFF;--surface:#171C2E}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:56px 20px;display:flex;flex-direction:column;gap:24px}
h1{margin:0;font-size:2rem}p{margin:0;color:var(--muted)}
a.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
a.card:hover{border-color:var(--accent)}a.card b{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Hugo Brandão</h1>
<p>Sites e sistemas para pequenos negócios.</p>
<a class="card" href="reservas-demo/"><b>Sistema de Reservas</b><p>Demonstração: marcações online, gestão pelo cliente e painel do negócio.</p></a>
</main>
</body>
</html>
