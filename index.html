<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelo de Sistema de Reservas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: app de coluna única; barra de topo com 3 vistas (Reservar / Gerir / Painel), passos em cartões */
  --bg:#F3F4F8; --surface:#FFFFFF; --ink:#141A2E; --muted:#5E6680; --line:#DCE0EA;
  --accent:#2C52D1; --accent-ink:#FFFFFF; --accent-soft:#E7ECFB;
  --ok:#1D7F47; --ok-soft:#E1F3E8; --warn:#9A5B00; --warn-soft:#FBEFD9; --bad:#B8362A; --bad-soft:#FBE5E2;
  --font-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font-body:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1220; --surface:#171C2E; --ink:#E9ECF5; --muted:#99A1BB; --line:#2A3148;
    --accent:#7D9BFF; --accent-ink:#0E1220; --accent-soft:#1F2A4F;
    --ok:#5CCB8A; --ok-soft:#163324; --warn:#F0B35A; --warn-soft:#3A2A10; --bad:#F08A7E; --bad-soft:#3D1D1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#171C2E; --ink:#E9ECF5; --muted:#99A1BB; --line:#2A3148;
  --accent:#7D9BFF; --accent-ink:#0E1220; --accent-soft:#1F2A4F;
  --ok:#5CCB8A; --ok-soft:#163324; --warn:#F0B35A; --warn-soft:#3A2A10; --bad:#F08A7E; --bad-soft:#3D1D1A;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.1rem}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.95rem}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{text-decoration:none;color:var(--muted);font-weight:600;padding:8px 12px;border-radius:999px;font-size:.92rem}
.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.demo-bar{background:var(--accent-soft);color:var(--ink);font-size:.88rem}
.demo-bar div{max-width:960px;margin:0 auto;padding:8px 16px}
.demo-bar b{color:var(--accent)}

.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
.wrap.wide{max-width:960px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.small{font-size:.88rem}

.steps{display:flex;gap:8px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);font-weight:600}
.steps li span{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem}
.steps li.on{color:var(--ink)} .steps li.on span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps li.done span{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.steps li+li::before{content:"";width:18px;height:1.5px;background:var(--line)}

.svc-list{display:flex;flex-direction:column;gap:8px}
.svc{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .15s}
.svc:hover{border-color:var(--accent)}
.svc .info{flex:1;display:flex;flex-direction:column;gap:2px}
.svc .name{font-weight:600}
.svc .price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dur{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;color:var(--muted)}

.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.date{flex:0 0 auto;width:64px;display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.date .wd{font-size:.75rem;color:var(--muted);text-transform:uppercase;font-weight:600}
.date .dn{font-family:var(--font-display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.date .mo{font-size:.72rem;color:var(--muted)}
.date[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.date[aria-pressed="true"] .wd,.date[aria-pressed="true"] .mo{color:var(--accent-ink)}
.date:disabled{opacity:.4;cursor:not-allowed}
.slot-group{display:flex;flex-direction:column;gap:8px}
.slot-group h3{font-family:var(--font-body);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.slot{padding:10px 0;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.slot:hover{border-color:var(--accent);color:var(--accent)}

.summary{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;background:var(--bg);border-radius:10px;padding:14px;font-size:.95rem}
.summary dt{color:var(--muted)} .summary dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.chosen{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:10px;padding:12px 14px}

form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.92rem}
.field input,.field select,.field textarea{padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.field .err{color:var(--bad);font-size:.85rem}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.field{flex:1 1 140px}

.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1.5px solid transparent;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.wa{background:#1FA855;color:#fff}
.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:8px}
.link{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0}

.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.pendente{background:var(--warn-soft);color:var(--warn)}
.pill.confirmada{background:var(--ok-soft);color:var(--ok)}
.pill.cancelada{background:var(--bad-soft);color:var(--bad)}
.pill.bloqueio{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

.success-mark{width:52px;height:52px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:1.6rem;font-weight:700}
.code{font-family:var(--font-display);font-size:1.6rem;letter-spacing:.12em;font-weight:700}
.notice{background:var(--bg);border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.9rem}
.empty{color:var(--muted);text-align:center;padding:18px;border:1.5px dashed var(--line);border-radius:10px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile .k{font-size:.82rem;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--font-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.tile.attn{border-color:var(--warn);background:var(--warn-soft)}
.daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daynav h2{flex:1;min-width:180px}
.agenda{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;background:var(--surface)}
.item.pendente{border-left-color:var(--warn)} .item.confirmada{border-left-color:var(--ok)}
.item.cancelada{border-left-color:var(--bad);opacity:.6} .item.bloqueio{border-left-color:var(--muted);background:var(--bg)}
.item .t{font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem}
.item .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.item .who b{overflow-wrap:anywhere}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){
  .item{grid-template-columns:1fr auto}
  .item .t{grid-column:1/-1}
  .tabs{margin-left:0;width:100%}
  .tabs a{flex:1;text-align:center}
}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="logo" aria-hidden="true">◷</span><span id="brandName"></span></div>
    <nav class="tabs" aria-label="Vistas">
      <a href="#reservar" data-tab="reservar">Reservar</a>
      <a href="#gerir" data-tab="gerir">Gerir</a>
      <a href="#painel" data-tab="painel">Painel</a>
    </nav>
  </div>
</header>
<div class="demo-bar"><div><b>Modelo de demonstração.</b> Negócio e clientes fictícios. Faça uma marcação e veja-a a aparecer no Painel (PIN <b>1234</b>).</div></div>
<main id="app"></main>

<script>
/* ===== Configuração do negócio: é só isto que muda de cliente para cliente ===== */
const CONFIG = {
  negocio: "Estúdio Exemplo",
  descricao: "Estética e bem-estar · Rua Exemplo, 10",
  moeda: "€",
  whatsapp: "351900000000",
  intervalo: 30,          // minutos entre horários propostos
  antecedencia: 60,       // minutos mínimos de antecedência para reservar
  diasVisiveis: 14,
  pinDemo: "1234",
  horario: {              // 0 = domingo
    0: [],
    1: [["09:00","13:00"],["14:00","19:00"]],
    2: [["09:00","13:00"],["14:00","19:00"]],
    3: [["09:00","13:00"],["14:00","19:00"]],
    4: [["09:00","13:00"],["14:00","19:00"]],
    5: [["09:00","13:00"],["14:00","19:00"]],
    6: [["09:00","13:00"]]
  },
  servicos: [
    {id:"s1", nome:"Limpeza de pele", duracao:60, preco:35, desc:"Limpeza profunda, esfoliação e máscara"},
    {id:"s2", nome:"Manicure", duracao:45, preco:15, desc:"Tratamento de unhas e verniz"},
    {id:"s3", nome:"Pedicure", duracao:60, preco:20, desc:"Tratamento completo dos pés"},
    {id:"s4", nome:"Design de sobrancelhas", duracao:30, preco:12, desc:"Desenho e depilação com linha"},
    {id:"s5", nome:"Massagem relaxante", duracao:90, preco:45, desc:"Corpo inteiro com óleos aromáticos"}
  ]
};

/* ===== Utilitários ===== */
const DIAS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const DIAS_L = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MESES_L = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const pad = n => String(n).padStart(2,"0");
const toKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate()+n); return toKey(d); };
const todayKey = () => toKey(new Date());
const hm = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };
const fmtT = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const fmtLong = k => { const d = fromKey(k); return `${DIAS_L[d.getDay()]}, ${d.getDate()} de ${MESES_L[d.getMonth()]}`; };
const money = v => `${v.toFixed(2).replace(".",",")} ${CONFIG.moeda}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const digits = s => String(s||"").replace(/\D/g,"");
const svc = id => CONFIG.servicos.find(s => s.id === id);
const overlap = (a1,a2,b1,b2) => a1 < b2 && b1 < a2;
const genCode = () => { const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let r=""; for(let i=0;i<5;i++) r+=c[Math.floor(Math.random()*c.length)]; return r; };
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };

/* ===== Dados (na versão real: base de dados MySQL) ===== */
const STORE = "reservas-modelo-v1";
function openDays(n){
  const out=[]; let k=todayKey(); let guard=0;
  while(out.length<n && guard<30){ if((CONFIG.horario[fromKey(k).getDay()]||[]).length) out.push(k); k=addDays(k,1); guard++; }
  return out;
}
function seed(){
  const d = openDays(4);
  const mk = (date, t, sid, nome, tel, status, code) => ({ id:"b"+Math.random().toString(36).slice(2,9), date, start:hm(t), dur:svc(sid).duracao, serviceId:sid, nome, tel, email:"", notas:"", status, code: code||genCode() });
  return {
    bookings: [
      mk(d[0],"10:00","s1","Marta Silva","912345678","confirmada","DEMO1"),
      mk(d[0],"15:00","s2","Joana Pereira","934567812","pendente"),
      mk(d[0],"17:00","s4","Rita Costa","961234987","confirmada"),
      mk(d[1],"09:00","s3","Ana Rodrigues","915678234","confirmada"),
      mk(d[1],"11:30","s4","Beatriz Lopes","926781345","pendente"),
      mk(d[1],"14:00","s5","Carla Mendes","918273645","confirmada"),
      mk(d[2],"10:00","s2","Sofia Almeida","937465821","pendente"),
      mk(d[3],"09:30","s1","Inês Santos","912837465","confirmada")
    ],
    blocks: [ { id:"k1", date:d[2], start:hm("16:00"), end:hm("19:00"), motivo:"Formação" } ]
  };
}
function load(){ try{ const raw = localStorage.getItem(STORE); if(raw) return JSON.parse(raw); }catch(e){} return null; }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(db)); }catch(e){} }
let db = load() || seed();

/* Horários livres para um serviço numa data — a mesma regra que o servidor tem de validar */
function freeSlots(dateKey, dur, ignoreId){
  const ints = CONFIG.horario[fromKey(dateKey).getDay()] || [];
  const isToday = dateKey === todayKey();
  if(dateKey < todayKey()) return [];
  const res = [];
  for(const [a,b] of ints){
    for(let t=hm(a); t+dur<=hm(b); t+=CONFIG.intervalo){
      if(isToday && t < nowMin() + CONFIG.antecedencia) continue;
      const busy = db.bookings.some(x => x.date===dateKey && x.status!=="cancelada" && x.id!==ignoreId && overlap(t,t+dur,x.start,x.start+x.dur))
                || db.blocks.some(x => x.date===dateKey && overlap(t,t+dur,x.start,x.end));
      if(!busy) res.push(t);
    }
  }
  return res;
}

/* ===== Estado da interface ===== */
const ui = {
  step:1, serviceId:null, date:null, time:null, form:{nome:"",tel:"",email:"",notas:""}, errors:{}, done:null, conflict:false,
  find:{code:"",tel:""}, found:null, findErr:"", resched:false, rDate:null, confirmCancel:false,
  admin:false, pin:"", pinErr:"", day:todayKey(), block:{date:todayKey(), start:"13:00", end:"14:00", motivo:""}, blockErr:""
};

/* ===== Componentes ===== */
function dateStrip(selected, dur, ignoreId, action){
  let html = '<div class="dates" role="group" aria-label="Escolher dia">';
  for(let i=0;i<CONFIG.diasVisiveis;i++){
    const k = addDays(todayKey(), i), d = fromKey(k);
    const n = freeSlots(k, dur, ignoreId).length;
    const closed = !(CONFIG.horario[d.getDay()]||[]).length;
    html += `<button class="date" data-a="${action}" data-k="${k}" aria-pressed="${k===selected}" ${n?"":"disabled"} title="${closed?"Fechado":n?n+" horários livres":"Sem vagas"}">
      <span class="wd">${i===0?"Hoje":DIAS[d.getDay()]}</span><span class="dn">${d.getDate()}</span><span class="mo">${closed?"fechado":MESES[d.getMonth()]}</span></button>`;
  }
  return html + "</div>";
}
function slotGrid(dateKey, dur, ignoreId, action){
  const s = freeSlots(dateKey, dur, ignoreId);
  if(!s.length) return '<p class="empty">Sem horários livres neste dia. Escolha outro dia.</p>';
  const groups = [["Manhã", s.filter(t=>t<13*60)], ["Tarde", s.filter(t=>t>=13*60)]].filter(g=>g[1].length);
  return groups.map(([lab, arr]) => `<div class="slot-group"><h3>${lab}</h3><div class="slots">${arr.map(t=>`<button class="slot" data-a="${action}" data-t="${t}">${fmtT(t)}</button>`).join("")}</div></div>`).join("");
}
function firstAvailable(dur, ignoreId){
  for(let i=0;i<CONFIG.diasVisiveis;i++){ const k=addDays(todayKey(),i); if(freeSlots(k,dur,ignoreId).length) return k; }
  return todayKey();
}
function summary(b){
  const s = svc(b.serviceId);
  return `<dl class="summary">
    <dt>Serviço</dt><dd>${esc(s.nome)}</dd>
    <dt>Dia</dt><dd>${fmtLong(b.date)}</dd>
    <dt>Hora</dt><dd>${fmtT(b.start)} – ${fmtT(b.start+s.duracao)}</dd>
    <dt>Preço</dt><dd>${money(s.preco)}</dd></dl>`;
}
function waLink(b){
  const s = svc(b.serviceId);
  const msg = `Olá! Fiz uma reserva no site.\nServiço: ${s.nome}\nDia: ${fmtLong(b.date)} às ${fmtT(b.start)}\nNome: ${b.nome}\nCódigo: ${b.code}`;
  return `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
}

/* ===== Vista: Reservar ===== */
function renderBook(){
  if(ui.done){
    const b = ui.done;
    return `<section class="card" aria-live="polite">
      <div class="success-mark" aria-hidden="true">✓</div>
      <h1>Pedido de reserva recebido</h1>
      <p class="muted">A reserva fica pendente até o ${esc(CONFIG.negocio)} a confirmar. Guarde o código para consultar, reagendar ou cancelar.</p>
      <div><p class="small muted">Código da reserva</p><p class="code">${b.code}</p></div>
      ${summary(b)}
      <p class="notice">${b.email ? `Na versão final, é enviado um email de confirmação para <b>${esc(b.email)}</b>.` : "Na versão final, é enviado um email de confirmação se o cliente indicar o email."}</p>
      <div class="btns">
        <a class="btn wa" href="${waLink(b)}" target="_blank" rel="noopener">Avisar por WhatsApp</a>
        <button class="btn ghost" data-a="newBooking">Fazer outra reserva</button>
      </div>
    </section>`;
  }
  const steps = ["Serviço","Dia e hora","Os seus dados"].map((l,i)=>`<li class="${ui.step===i+1?"on":ui.step>i+1?"done":""}"><span>${ui.step>i+1?"✓":i+1}</span>${l}</li>`).join("");
  let body = "";
  if(ui.step===1){
    body = `<h2>Escolha o serviço</h2><div class="svc-list">${CONFIG.servicos.map(s=>`
      <button class="svc" data-a="pickService" data-id="${s.id}">
        <span class="info"><span class="name">${esc(s.nome)}</span><span class="small muted">${esc(s.desc)}</span><span class="dur">◷ ${s.duracao} min</span></span>
        <span class="price">${money(s.preco)}</span></button>`).join("")}</div>`;
  } else if(ui.step===2){
    const s = svc(ui.serviceId);
    body = `<div class="chosen"><div><b>${esc(s.nome)}</b><div class="small muted">${s.duracao} min · ${money(s.preco)}</div></div><button class="link" data-a="goStep" data-s="1">Alterar</button></div>
      <h2>Escolha o dia</h2>${dateStrip(ui.date, s.duracao, null, "pickDate")}
      <h2>Horários livres · ${fmtLong(ui.date)}</h2>
      ${ui.conflict?'<p class="notice">Esse horário acabou de ser ocupado. Escolha outro.</p>':""}
      ${slotGrid(ui.date, s.duracao, null, "pickTime")}`;
  } else {
    const e = ui.errors, f = ui.form;
    body = `<h2>Confirme a reserva</h2>${summary({serviceId:ui.serviceId,date:ui.date,start:ui.time})}
      <button class="link" data-a="goStep" data-s="2" style="align-self:flex-start">Alterar dia ou hora</button>
      <form data-form="book" novalidate>
        <div class="field"><label for="f-nome">Nome</label><input id="f-nome" data-bind="nome" value="${esc(f.nome)}" autocomplete="name">${e.nome?`<span class="err">${e.nome}</span>`:""}</div>
        <div class="row">
          <div class="field"><label for="f-tel">Telemóvel</label><input id="f-tel" data-bind="tel" inputmode="tel" value="${esc(f.tel)}" autocomplete="tel" placeholder="912 345 678">${e.tel?`<span class="err">${e.tel}</span>`:""}</div>
          <div class="field"><label for="f-email">Email (opcional)</label><input id="f-email" data-bind="email" type="email" value="${esc(f.email)}" autocomplete="email">${e.email?`<span class="err">${e.email}</span>`:""}</div>
        </div>
        <div class="field"><label for="f-notas">Observações (opcional)</label><textarea id="f-notas" data-bind="notas" rows="2">${esc(f.notas)}</textarea></div>
        <div class="btns"><button class="btn primary" type="submit">Confirmar reserva</button><button class="btn ghost" type="button" data-a="goStep" data-s="2">Voltar</button></div>
      </form>`;
  }
  return `<section class="card"><div><h1>${esc(CONFIG.negocio)}</h1><p class="muted">${esc(CONFIG.descricao)}</p></div><ol class="steps">${steps}</ol></section>
    <section class="card">${body}</section>`;
}

/* ===== Vista: A minha reserva ===== */
function renderManage(){
  const b = ui.found && db.bookings.find(x=>x.id===ui.found);
  if(!b){
    return `<section class="card"><h1>A minha reserva</h1><p class="muted">Consulte, reagende ou cancele com o código que recebeu.</p>
      <form data-form="find" novalidate>
        <div class="row">
          <div class="field"><label for="m-code">Código da reserva</label><input id="m-code" data-bind-find="code" value="${esc(ui.find.code)}" autocapitalize="characters" placeholder="Ex.: DEMO1"></div>
          <div class="field"><label for="m-tel">Telemóvel usado na reserva</label><input id="m-tel" data-bind-find="tel" inputmode="tel" value="${esc(ui.find.tel)}"></div>
        </div>
        ${ui.findErr?`<p class="err" style="color:var(--bad)">${ui.findErr}</p>`:""}
        <div class="btns"><button class="btn primary" type="submit">Procurar reserva</button></div>
      </form>
      <p class="notice">Para testar: código <b>DEMO1</b> e telemóvel <b>912 345 678</b>.</p></section>`;
  }
  const s = svc(b.serviceId);
  let extra = "";
  if(b.status==="cancelada"){
    extra = `<p class="notice">Esta reserva foi cancelada.</p>`;
  } else if(ui.resched){
    extra = `<h2>Escolha o novo dia</h2>${dateStrip(ui.rDate, s.duracao, b.id, "rDate")}
      <h2>Horários livres · ${fmtLong(ui.rDate)}</h2>${slotGrid(ui.rDate, s.duracao, b.id, "rTime")}
      <div class="btns"><button class="btn ghost" data-a="rCancel">Manter horário atual</button></div>`;
  } else {
    extra = `<div class="btns">
      <button class="btn primary" data-a="rStart">Reagendar</button>
      ${ui.confirmCancel
        ? `<button class="btn danger" data-a="doCancel">Sim, cancelar reserva</button><button class="btn ghost" data-a="noCancel">Não</button>`
        : `<button class="btn danger" data-a="askCancel">Cancelar reserva</button>`}
    </div>`;
  }
  return `<section class="card">
    <div class="chosen"><div><p class="small muted">Reserva ${b.code}</p><h1>${esc(b.nome)}</h1></div><span class="pill ${b.status}">${b.status}</span></div>
    ${summary(b)}${extra}
    <button class="link" data-a="findAgain" style="align-self:flex-start">Procurar outra reserva</button></section>`;
}

/* ===== Vista: Painel do negócio ===== */
function renderAdmin(){
  if(!ui.admin){
    return `<section class="card" style="max-width:420px;align-self:center;width:100%"><h1>Painel do negócio</h1>
      <p class="muted">Área reservada. Na versão final: email e palavra-passe encriptada.</p>
      <form data-form="pin" novalidate><div class="field"><label for="pin">PIN</label><input id="pin" data-bind-pin="1" inputmode="numeric" type="password" value="${esc(ui.pin)}" autocomplete="off">${ui.pinErr?`<span class="err">${ui.pinErr}</span>`:""}</div>
      <div class="btns"><button class="btn primary" type="submit">Entrar</button></div></form>
      <p class="notice">PIN da demonstração: <b>${CONFIG.pinDemo}</b></p></section>`;
  }
  const t = todayKey(), week = Array.from({length:7},(_,i)=>addDays(t,i));
  const active = db.bookings.filter(b=>b.status!=="cancelada");
  const today = active.filter(b=>b.date===t).length;
  const pend = db.bookings.filter(b=>b.status==="pendente" && b.date>=t).sort((a,b)=>(a.date+fmtT(a.start)).localeCompare(b.date+fmtT(b.start)));
  const wk = active.filter(b=>week.includes(b.date));
  const rev = wk.reduce((sum,b)=>sum+svc(b.serviceId).preco,0);

  const items = [
    ...db.bookings.filter(b=>b.date===ui.day).map(b=>({kind:"b", start:b.start, b})),
    ...db.blocks.filter(k=>k.date===ui.day).map(k=>({kind:"k", start:k.start, k}))
  ].sort((a,b)=>a.start-b.start);
  const agenda = items.length ? items.map(it=>{
    if(it.kind==="k"){ const k=it.k; return `<div class="item bloqueio"><span class="t">${fmtT(k.start)}–${fmtT(k.end)}</span>
      <span class="who"><b>Bloqueado</b><span class="small muted">${esc(k.motivo||"Sem motivo")}</span></span>
      <span class="acts"><button class="btn ghost sm" data-a="unblock" data-id="${k.id}">Desbloquear</button></span></div>`; }
    const b = it.b, s = svc(b.serviceId);
    return `<div class="item ${b.status}"><span class="t">${fmtT(b.start)}–${fmtT(b.start+b.dur)}</span>
      <span class="who"><b>${esc(b.nome)}</b><span class="small muted">${esc(s.nome)} · ${esc(b.tel)}</span>${b.notas?`<span class="small muted">“${esc(b.notas)}”</span>`:""}</span>
      <span class="acts"><span class="pill ${b.status}">${b.status}</span>
      ${b.status==="pendente"?`<button class="btn ok sm" data-a="confirm" data-id="${b.id}">Confirmar</button>`:""}
      ${b.status!=="cancelada"?`<button class="btn danger sm" data-a="adminCancel" data-id="${b.id}">Cancelar</button>`:""}</span></div>`;
  }).join("") : `<p class="empty">${(CONFIG.horario[fromKey(ui.day).getDay()]||[]).length ? "Sem marcações neste dia." : "Fechado neste dia."}</p>`;

  const times = []; for(let m=7*60;m<=21*60;m+=30) times.push(fmtT(m));
  const opt = (v)=>times.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("");

  return `<div class="tiles">
      <div class="tile"><div class="k">Marcações hoje</div><div class="v">${today}</div></div>
      <div class="tile ${pend.length?"attn":""}"><div class="k">Por confirmar</div><div class="v">${pend.length}</div></div>
      <div class="tile"><div class="k">Próximos 7 dias</div><div class="v">${wk.length}</div></div>
      <div class="tile"><div class="k">Faturação prevista (7 dias)</div><div class="v">${money(rev)}</div></div>
    </div>
    <section class="card">
      <div class="daynav"><button class="btn ghost sm" data-a="dayPrev" aria-label="Dia anterior">‹</button>
        <h2>${ui.day===t?"Hoje · ":""}${fmtLong(ui.day)}</h2>
        <button class="btn ghost sm" data-a="dayToday">Hoje</button><button class="btn ghost sm" data-a="dayNext" aria-label="Dia seguinte">›</button></div>
      <div class="agenda">${agenda}</div>
    </section>
    <div class="two">
      <section class="card"><h2>Por confirmar</h2>
        ${pend.length ? `<div class="agenda">${pend.map(b=>`<div class="item pendente"><span class="t">${DIAS[fromKey(b.date).getDay()]} ${fromKey(b.date).getDate()}<br>${fmtT(b.start)}</span>
          <span class="who"><b>${esc(b.nome)}</b><span class="small muted">${esc(svc(b.serviceId).nome)}</span></span>
          <span class="acts"><button class="btn ok sm" data-a="confirm" data-id="${b.id}">Confirmar</button></span></div>`).join("")}</div>` : '<p class="empty">Tudo confirmado.</p>'}
      </section>
      <section class="card"><h2>Bloquear horário</h2><p class="small muted">Folgas, almoço ou formações. Os clientes deixam de ver estas horas.</p>
        <form data-form="block" novalidate>
          <div class="field"><label for="bk-date">Dia</label><input id="bk-date" type="date" data-bind-block="date" value="${ui.block.date}" min="${t}"></div>
          <div class="row"><div class="field"><label for="bk-s">Das</label><select id="bk-s" data-bind-block="start">${opt(ui.block.start)}</select></div>
          <div class="field"><label for="bk-e">Às</label><select id="bk-e" data-bind-block="end">${opt(ui.block.end)}</select></div></div>
          <div class="field"><label for="bk-m">Motivo (opcional)</label><input id="bk-m" data-bind-block="motivo" value="${esc(ui.block.motivo)}"></div>
          ${ui.blockErr?`<p class="err" style="color:var(--bad)">${ui.blockErr}</p>`:""}
          <div class="btns"><button class="btn primary" type="submit">Bloquear</button></div>
        </form></section>
    </div>
    <div class="btns"><button class="btn ghost" data-a="reset">Repor dados de demonstração</button><button class="btn ghost" data-a="logout">Sair do painel</button></div>`;
}

/* ===== Navegação e eventos ===== */
const app = document.getElementById("app");
document.getElementById("brandName").textContent = CONFIG.negocio;
const route = () => ({"#gerir":"gerir","#painel":"painel"}[location.hash] || "reservar");
function render(){
  const v = route();
  document.querySelectorAll(".tabs a").forEach(a=>{ if(a.dataset.tab===v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  app.className = "wrap" + (v==="painel" && ui.admin ? " wide" : "");
  app.innerHTML = v==="painel" ? renderAdmin() : v==="gerir" ? renderManage() : renderBook();
}
window.addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); });

const actions = {
  pickService: d => { ui.serviceId=d.id; ui.date=firstAvailable(svc(d.id).duracao); ui.time=null; ui.conflict=false; ui.step=2; },
  pickDate: d => { ui.date=d.k; ui.conflict=false; },
  pickTime: d => { ui.time=+d.t; ui.step=3; ui.errors={}; },
  goStep: d => { ui.step=+d.s; ui.conflict=false; },
  newBooking: () => { ui.done=null; ui.step=1; ui.serviceId=null; ui.form={nome:"",tel:"",email:"",notas:""}; },
  rStart: () => { const b=db.bookings.find(x=>x.id===ui.found); ui.resched=true; ui.rDate=freeSlots(b.date,b.dur,b.id).length?b.date:firstAvailable(b.dur,b.id); },
  rDate: d => { ui.rDate=d.k; },
  rTime: d => { const b=db.bookings.find(x=>x.id===ui.found); if(!freeSlots(ui.rDate,b.dur,b.id).includes(+d.t)) return; b.date=ui.rDate; b.start=+d.t; b.status="pendente"; ui.resched=false; save(); },
  rCancel: () => { ui.resched=false; },
  askCancel: () => { ui.confirmCancel=true; },
  noCancel: () => { ui.confirmCancel=false; },
  doCancel: () => { const b=db.bookings.find(x=>x.id===ui.found); b.status="cancelada"; ui.confirmCancel=false; save(); },
  findAgain: () => { ui.found=null; ui.resched=false; ui.confirmCancel=false; },
  confirm: d => { const b=db.bookings.find(x=>x.id===d.id); if(b){ b.status="confirmada"; save(); } },
  adminCancel: d => { const b=db.bookings.find(x=>x.id===d.id); if(b){ b.status="cancelada"; save(); } },
  unblock: d => { db.blocks=db.blocks.filter(k=>k.id!==d.id); save(); },
  dayPrev: () => { ui.day=addDays(ui.day,-1); },
  dayNext: () => { ui.day=addDays(ui.day,1); },
  dayToday: () => { ui.day=todayKey(); },
  reset: () => { db=seed(); save(); ui.day=todayKey(); },
  logout: () => { ui.admin=false; ui.pin=""; }
};
app.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if(!el) return;
  const fn = actions[el.dataset.a]; if(!fn) return;
  e.preventDefault(); fn(el.dataset); render();
});
app.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.bind) ui.form[t.dataset.bind]=t.value;
  if(t.dataset.bindFind) ui.find[t.dataset.bindFind]=t.value;
  if(t.dataset.bindPin) ui.pin=t.value;
  if(t.dataset.bindBlock) ui.block[t.dataset.bindBlock]=t.value;
});
app.addEventListener("change", e => { const t=e.target; if(t.dataset.bindBlock) ui.block[t.dataset.bindBlock]=t.value; });
app.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if(f==="book"){
    const v=ui.form, er={};
    if(v.nome.trim().length<2) er.nome="Indique o seu nome.";
    if(digits(v.tel).length<9) er.tel="Indique um número com pelo menos 9 dígitos.";
    if(v.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) er.email="Este email não parece válido.";
    ui.errors=er;
    if(!Object.keys(er).length){
      const s=svc(ui.serviceId);
      // Validação final do horário (na versão real é feita no servidor, dentro de uma transação)
      if(!freeSlots(ui.date, s.duracao).includes(ui.time)){ ui.step=2; ui.conflict=true; }
      else {
        let code; do{ code=genCode(); } while(db.bookings.some(b=>b.code===code));
        const b={ id:"b"+Date.now().toString(36), date:ui.date, start:ui.time, dur:s.duracao, serviceId:s.id, nome:v.nome.trim(), tel:v.tel.trim(), email:v.email.trim(), notas:v.notas.trim(), status:"pendente", code };
        db.bookings.push(b); save(); ui.done=b;
      }
    }
  }
  if(f==="find"){
    const code=ui.find.code.trim().toUpperCase(), tel=digits(ui.find.tel).slice(-9);
    const b=db.bookings.find(x=>x.code===code && digits(x.tel).slice(-9)===tel);
    if(b){ ui.found=b.id; ui.findErr=""; } else ui.findErr="Não encontrámos nenhuma reserva com esse código e telemóvel.";
  }
  if(f==="pin"){
    if(ui.pin===CONFIG.pinDemo){ ui.admin=true; ui.pinErr=""; ui.day=todayKey(); } else ui.pinErr="PIN incorreto.";
  }
  if(f==="block"){
    const k=ui.block, s=hm(k.start), en=hm(k.end);
    if(!k.date) ui.blockErr="Escolha o dia.";
    else if(en<=s) ui.blockErr="A hora de fim tem de ser depois da hora de início.";
    else { db.blocks.push({id:"k"+Date.now().toString(36), date:k.date, start:s, end:en, motivo:k.motivo.trim()}); ui.blockErr=""; ui.day=k.date; ui.block.motivo=""; save(); }
  }
  render();
});
render();
</script>
</body>
</html>
